name: Build macOS app

# Manual trigger only, on purpose: this is the FIRST time build_mac.sh has
# ever run on real macOS (it was written on Windows with no Mac available
# to test it on - see CLAUDE.md's "Cross-platform" section). Run it by hand
# from the Actions tab (or `gh workflow run build-macos.yml`), inspect the
# test results and the downloaded .dmg, and only wire this to run
# automatically on release tags once a build has actually been verified.
on:
  workflow_dispatch:

jobs:
  build:
    # macos-13 (Intel) was tried here too, but GitHub's Intel macOS
    # runners are chronically unavailable - every attempt sat queued for
    # 19-24h before being auto-cancelled, never actually running (see run
    # history). Apple Silicon (macos-14) runs reliably in ~1 minute, so
    # that's the only leg for now - revisit Intel if GitHub's runner
    # availability ever improves.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: apple-silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create build venv and install dependencies
        run: |
          python3 -m venv venv_build
          source venv_build/bin/activate
          pip install -r requirements.txt pyinstaller

      - name: Write placeholder default credentials
        # Same file load_default_credentials() reads on Kevin's own local
        # build (see track_tidy.py). This workflow only builds a SMOKE-TEST
        # .dmg (does the cross-platform port compile, launch, and pass its
        # tests) - it isn't the real release pipeline (see the on: comment
        # above), so it has no actual need for working API credentials, and
        # bundling the REAL ones here would put them in a downloadable
        # GitHub Actions artifact on every run of this workflow, including
        # an ad-hoc test run with no intent to release - a needless extra
        # exposure channel for the shared credentials beyond the already-
        # accepted one (real installers actually shipped to users).
        #
        # These are dummy, non-secret placeholder values - just non-empty,
        # since the test suite only checks THAT the webhook URL etc. is
        # configured (see send_scan_complete_notification/
        # send_new_install_notification), never dereferences it for a real
        # network call (requests.post is mocked in every test that cares).
        run: |
          jq -n \
            '{soundcloud_client_id: "ci-placeholder", soundcloud_client_secret: "ci-placeholder", spotify_client_id: "ci-placeholder", spotify_client_secret: "ci-placeholder", discord_webhook_url: "https://discord.com/api/webhooks/0/ci-placeholder", acoustid_api_key: "ci-placeholder", discord_bot_token: "ci-placeholder"}' \
            > default_credentials.json

      - name: Bundle a macOS ffmpeg binary
        # build_mac.sh only bundles ffmpeg into the .app if a binary is
        # already sitting at ./ffmpeg before it runs - nobody had ever put
        # one there for a macOS build, so WAV->AIFF conversion and RIFF
        # INFO tag writing (both shell out to it) silently degraded on Mac
        # even though they work fine on Windows (ffmpeg.exe is checked
        # into the repo there).
        #
        # Runs BEFORE the test suite (not after) - find_ffmpeg() picks up
        # this same ./ffmpeg for tests too, and a real report showed why
        # that matters: a WAV RIFF INFO test failed on this runner because
        # write_tags()'s RIFF-clearing silently no-ops without ffmpeg,
        # leaving assets/fart.wav's own baked-in RIFF INFO artist tag
        # ("Gaming Sound FX") untouched instead of actually being cleared.
        #
        # Homebrew's ffmpeg is pre-installed on GitHub's macOS runners, but
        # it's dynamically linked against its OWN Homebrew-installed
        # dependencies (dav1d, x264, x265, libvpx...) at absolute
        # /opt/homebrew (or /usr/local) paths - copying just the ffmpeg
        # binary alone would be broken on any Mac without Homebrew (i.e.
        # every real end user). dylibbundler resolves and copies every
        # dependency into ./ffmpeg-libs and rewrites ffmpeg's own link
        # paths to look for them next to itself instead - the standard
        # tool for exactly this "redistribute a Homebrew binary" case.
        run: |
          which ffmpeg || brew install ffmpeg
          brew install dylibbundler
          cp "$(which ffmpeg)" ./ffmpeg
          chmod +w ./ffmpeg
          dylibbundler -od -b -x ./ffmpeg -d ./ffmpeg-libs -p "@executable_path/ffmpeg-libs/"
          echo "--- ffmpeg link dependencies after bundling (should show no /opt/homebrew or /usr/local paths left) ---"
          otool -L ./ffmpeg
          echo "--- bundled dylib count and total size ---"
          ls -la ./ffmpeg-libs | wc -l
          du -sh ./ffmpeg ./ffmpeg-libs

      - name: Run the test suite
        run: |
          source venv_build/bin/activate
          python -m unittest discover -s tests

      - name: Build .app and .dmg
        run: |
          source venv_build/bin/activate
          chmod +x build_mac.sh
          ./build_mac.sh

      - name: Verify the bundled ffmpeg actually runs
        # otool -L only proves the link PATHS look right - this proves the
        # binary genuinely executes, dependencies and all.
        run: dist/Track-Tidy.app/Contents/MacOS/ffmpeg -version

      - name: Launch the app and verify it doesn't crash on startup
        # A local build's .app has no quarantine attribute (that's only
        # set on files that arrive via a browser/AirDrop/etc, not ones
        # compiled right here) - Gatekeeper's "unidentified developer"
        # block, a real concern for anyone who downloads the finished
        # .dmg, doesn't apply to this same-machine launch. Only checks
        # "does it start and stay up", not any actual feature.
        run: |
          "dist/Track-Tidy.app/Contents/MacOS/Track-Tidy" > launch.log 2>&1 &
          APP_PID=$!
          sleep 5
          if kill -0 $APP_PID 2>/dev/null; then
            echo "Still running after 5s (PID $APP_PID) - clean launch."
            screencapture -x launch_screenshot.png || echo "screencapture failed (no display attached to this runner?)"
            kill $APP_PID
          else
            echo "Exited within 5s on its own - crashed on startup. Log:"
            cat launch.log
            exit 1
          fi

      - name: Upload launch-check artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Track-Tidy-macOS-${{ matrix.arch }}-launch-check-v${{ github.run_number }}
          path: |
            launch.log
            launch_screenshot.png
          if-no-files-found: ignore

      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: Track-Tidy-macOS-${{ matrix.arch }}-v${{ github.run_number }}
          path: installer_output/*.dmg
          if-no-files-found: error
