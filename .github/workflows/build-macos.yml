name: Build macOS app

# Manual trigger only: run it by hand from the Actions tab, or
# `gh workflow run build-macos.yml -f target=apple-silicon` for an ad-hoc
# smoke-test build off a branch, or `gh workflow run build-macos.yml --ref
# <tag> -f target=...` for a real release build - see the credentials step
# below for how the two differ (real secrets + a GitHub Release upload
# only happen for the latter, detected via github.ref_type == 'tag').
#
# `target` picks exactly ONE architecture to build per dispatch (required,
# no default) - a physical Intel runner (macos-13) was tried once for the
# `intel` leg, but GitHub's Intel macOS runners are chronically
# unavailable (every attempt sat queued 19-24h before being auto-
# cancelled, never actually running). The `intel` leg below instead
# builds a genuine x86_64 binary on the same Apple-Silicon (macos-14)
# runner, forced through Rosetta 2 emulation (`arch -x86_64` / a
# translated shell) - a local capability of the runner itself, not
# dependent on GitHub's runner-allocation queue. UNVERIFIED on real Intel
# Mac hardware (none available) - treat the first real dispatch of this
# leg as a test, not a guaranteed one-shot success.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which architecture to build"
        required: true
        type: choice
        options:
          - apple-silicon
          - intel

jobs:
  build:
    # The GITHUB_TOKEN's default permissions are read-only for this repo -
    # needed so the "Attach .dmg + checksum to the GitHub Release" step's
    # `gh release upload` can actually write the asset (otherwise: "HTTP
    # 403: Resource not accessible by integration").
    permissions:
      contents: write
    # Both legs run on the SAME (Apple Silicon) runner - the `intel` leg
    # gets there via Rosetta 2 emulation instead of a separate runner OS
    # (see the top-of-file comment). Gated below so a single dispatch only
    # actually builds the one architecture `target` asked for - keeps a
    # release for one arch from also spending CI time (and risk) on the
    # other.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: apple-silicon
          - os: macos-14
            arch: intel
    if: matrix.arch == github.event.inputs.target
    runs-on: ${{ matrix.os }}
    # Hard backstop, same reasoning as gui-smoke-test.yml's own cap: this
    # job is far more prone to hanging (brew install, a curl fetch, hdiutil
    # create, gh release upload) than that one was even before it got its
    # own timeout after a real incident - and this is the job used for
    # actual release builds, so a silent hang here is the costliest one to
    # leave uncapped. The intel leg's extra Rosetta/x86_64-Homebrew setup
    # needs more headroom than the apple-silicon leg ever did.
    timeout-minutes: ${{ matrix.arch == 'intel' && 45 || 30 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rosetta 2 (intel leg only)
        # Not assumed pre-installed on this runner image. A local,
        # same-runner install - unlike the abandoned physical Intel-runner
        # attempt (see top-of-file comment), this isn't gated behind
        # GitHub's runner-allocation queue at all.
        if: matrix.arch == 'intel'
        run: softwareupdate --install-rosetta --agree-to-license

      - name: Create build venv and install dependencies
        # actions/setup-python's installed 3.12 is a universal2 build
        # (covers both arm64 and x86_64) - for the intel leg, this whole
        # step runs through a Rosetta-translated shell (see `shell:`
        # below), so `python3` here resolves that build's x86_64 slice,
        # and every package pip installs into this venv is an x86_64
        # wheel. Everything spawned from within an already-translated
        # shell inherits x86_64 automatically - a translated shell for
        # THIS step alone doesn't carry over to later steps, so the build
        # step further down needs the same treatment.
        shell: ${{ matrix.arch == 'intel' && 'arch -x86_64 /bin/bash --noprofile --norc -eo pipefail {0}' || 'bash' }}
        run: |
          python3 -m venv venv_build
          source venv_build/bin/activate
          pip install -r requirements.txt pyinstaller

      - name: Write default credentials
        # Same file load_default_credentials() reads on Kevin's own local
        # build (see track_tidy.py). Most runs of this workflow are just a
        # SMOKE TEST (does the cross-platform port compile, launch, and
        # pass its tests) triggered ad hoc off a branch - those get dummy,
        # non-secret placeholder values, since bundling the REAL ones would
        # put them in a downloadable GitHub Actions artifact on every such
        # run, a needless extra exposure channel for the shared credentials
        # beyond the already-accepted one (real installers actually shipped
        # to users). The placeholders are only non-empty, not meaningful -
        # the test suite only checks THAT the webhook URL etc. is
        # configured (see send_scan_complete_notification/
        # send_new_install_notification), never dereferences it for a real
        # network call (requests.post is mocked in every test that cares).
        #
        # The one exception is a run dispatched against an actual release
        # TAG (github.ref_type == 'tag' - see "gh workflow run
        # build-macos.yml --ref <tag>" in CLAUDE.md's Build notes): that
        # produces the real .dmg attached to the GitHub Release itself
        # (see the upload step at the end of this job), which is the
        # already-accepted distribution channel for these credentials, so
        # it uses the real repo secrets like the Windows build does locally.
        env:
          IS_RELEASE: ${{ github.ref_type == 'tag' }}
          SOUNDCLOUD_CLIENT_ID: ${{ secrets.SOUNDCLOUD_CLIENT_ID }}
          SOUNDCLOUD_CLIENT_SECRET: ${{ secrets.SOUNDCLOUD_CLIENT_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ACOUSTID_API_KEY: ${{ secrets.ACOUSTID_API_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          if [ "$IS_RELEASE" = "true" ]; then
            jq -n \
              --arg soundcloud_client_id "$SOUNDCLOUD_CLIENT_ID" \
              --arg soundcloud_client_secret "$SOUNDCLOUD_CLIENT_SECRET" \
              --arg discord_webhook_url "$DISCORD_WEBHOOK_URL" \
              --arg acoustid_api_key "$ACOUSTID_API_KEY" \
              --arg discord_bot_token "$DISCORD_BOT_TOKEN" \
              '{soundcloud_client_id: $soundcloud_client_id, soundcloud_client_secret: $soundcloud_client_secret, discord_webhook_url: $discord_webhook_url, acoustid_api_key: $acoustid_api_key, discord_bot_token: $discord_bot_token}' \
              > default_credentials.json
          else
            jq -n \
              '{soundcloud_client_id: "ci-placeholder", soundcloud_client_secret: "ci-placeholder", discord_webhook_url: "https://discord.com/api/webhooks/0/ci-placeholder", acoustid_api_key: "ci-placeholder", discord_bot_token: "ci-placeholder"}' \
              > default_credentials.json
          fi

      - name: Bundle a macOS ffmpeg binary
        # build_mac.sh only bundles ffmpeg into the .app if a binary is
        # already sitting at ./ffmpeg before it runs - nobody had ever put
        # one there for a macOS build, so WAV->AIFF conversion and RIFF
        # INFO tag writing (both shell out to it) silently degraded on Mac
        # even though they work fine on Windows (ffmpeg.exe is checked
        # into the repo there).
        #
        # Runs BEFORE the test suite (not after) - find_ffmpeg() picks up
        # this same ./ffmpeg for tests too, and a real report showed why
        # that matters: a WAV RIFF INFO test failed on this runner because
        # write_tags()'s RIFF-clearing silently no-ops without ffmpeg,
        # leaving assets/fart.wav's own baked-in RIFF INFO artist tag
        # ("Gaming Sound FX") untouched instead of actually being cleared.
        #
        # Homebrew's ffmpeg is pre-installed on GitHub's macOS runners, but
        # it's dynamically linked against its OWN Homebrew-installed
        # dependencies (dav1d, x264, x265, libvpx...) at absolute
        # /opt/homebrew (or /usr/local) paths - copying just the ffmpeg
        # binary alone would be broken on any Mac without Homebrew (i.e.
        # every real end user). dylibbundler resolves and copies every
        # dependency into ./ffmpeg-libs and rewrites ffmpeg's own link
        # paths to look for them next to itself instead - the standard
        # tool for exactly this "redistribute a Homebrew binary" case.
        #
        # For the intel leg: this runner's default Homebrew prefix
        # (/opt/homebrew) only ever has arm64 formula binaries - a second,
        # parallel x86_64 Homebrew at the traditional Intel prefix
        # (/usr/local), installed and run under Rosetta, is the standard
        # way to get an x86_64 ffmpeg build on an Apple Silicon host.
        # dylibbundler itself doesn't need to match the target arch (it's
        # just rewriting the ffmpeg binary's Mach-O link paths, not
        # executing as part of the app) - the arm64 one from the default
        # Homebrew is fine for that.
        run: |
          if [ "${{ matrix.arch }}" = "intel" ]; then
            if [ ! -x /usr/local/bin/brew ]; then
              arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
            fi
            arch -x86_64 /usr/local/bin/brew install ffmpeg
            FFMPEG_BIN=/usr/local/bin/ffmpeg
          else
            which ffmpeg || brew install ffmpeg
            FFMPEG_BIN="$(which ffmpeg)"
          fi
          brew install dylibbundler
          cp "$FFMPEG_BIN" ./ffmpeg
          chmod +w ./ffmpeg
          dylibbundler -od -b -x ./ffmpeg -d ./ffmpeg-libs -p "@executable_path/ffmpeg-libs/"
          echo "--- ffmpeg link dependencies after bundling (should show no /opt/homebrew or /usr/local paths left) ---"
          otool -L ./ffmpeg
          echo "--- bundled dylib count and total size ---"
          ls -la ./ffmpeg-libs | wc -l
          du -sh ./ffmpeg ./ffmpeg-libs

      - name: Bundle a macOS fpcalc binary
        # Same gap as ffmpeg above, never closed for fpcalc: build_mac.sh
        # only bundles it into the .app if a binary is already sitting at
        # ./fpcalc before it runs, and nothing ever put one there for a
        # macOS build - the optional AcoustID audio-identification fallback
        # has been silently non-functional on every macOS release so far
        # (find_fpcalc() just finds nothing and skips it, no crash, no
        # visible error - see USE_ACOUSTID_FALLBACK).
        #
        # Unlike Homebrew's ffmpeg, Chromaprint's own official release
        # build is statically linked - no dylibbundler treatment needed,
        # confirmed below by otool -L showing no /opt/homebrew or
        # /usr/local paths to begin with. Picks the arch-matching release
        # asset directly (confirmed both exist for v1.6.1) - running the
        # downloaded binary below (./fpcalc -version) works for the intel
        # leg without any extra `arch` handling, since macOS transparently
        # routes an x86_64 executable through Rosetta once it's installed
        # (see the Rosetta-install step above), the same as any other
        # direct invocation of the bundled x86_64 binary later in this job.
        run: |
          if [ "${{ matrix.arch }}" = "intel" ]; then
            FPCALC_URL="https://github.com/acoustid/chromaprint/releases/download/v1.6.1/chromaprint-fpcalc-1.6.1-macos-x86_64.tar.gz"
          else
            FPCALC_URL="https://github.com/acoustid/chromaprint/releases/download/v1.6.1/chromaprint-fpcalc-1.6.1-macos-arm64.tar.gz"
          fi
          curl -L -o fpcalc.tar.gz "$FPCALC_URL"
          mkdir fpcalc_extracted
          tar -xzf fpcalc.tar.gz -C fpcalc_extracted
          find fpcalc_extracted -type f -name fpcalc -exec cp {} ./fpcalc \;
          chmod +x ./fpcalc
          echo "--- fpcalc link dependencies (should show no /opt/homebrew or /usr/local paths) ---"
          otool -L ./fpcalc
          ./fpcalc -version

      - name: Run the test suite
        shell: ${{ matrix.arch == 'intel' && 'arch -x86_64 /bin/bash --noprofile --norc -eo pipefail {0}' || 'bash' }}
        run: |
          source venv_build/bin/activate
          python -m unittest discover -s tests

      - name: Build .app and .dmg
        shell: ${{ matrix.arch == 'intel' && 'arch -x86_64 /bin/bash --noprofile --norc -eo pipefail {0}' || 'bash' }}
        run: |
          source venv_build/bin/activate
          chmod +x build_mac.sh
          ./build_mac.sh

      - name: Verify the bundled ffmpeg actually runs
        # otool -L only proves the link PATHS look right - this proves the
        # binary genuinely executes, dependencies and all.
        run: dist/Track-Tidy.app/Contents/MacOS/ffmpeg -version

      - name: Verify the bundled fpcalc actually runs
        run: dist/Track-Tidy.app/Contents/MacOS/fpcalc -version

      - name: Verify the app's code signature is actually intact
        # The launch check below this one runs the .app same-machine and
        # unquarantined, which can only ever catch a crash, never a broken
        # code signature (macOS doesn't re-verify a signature just to launch
        # something locally). "codesign --verify --deep --strict" is the
        # actual "is this bundle's signature intact and does it match every
        # file inside it" check Gatekeeper itself runs on a quarantined
        # download - deliberately NOT "spctl --assess", which would also
        # (correctly, expectedly) reject this build for lacking a real
        # Developer ID + notarization (see CLAUDE.md - not done, needs a
        # paid Apple account) even with a perfectly intact signature, so it
        # can't distinguish that already-accepted limitation from the actual
        # bug this guards against. Real report: build_mac.sh's post-
        # PyInstaller-signing file copies (ffmpeg/fpcalc/credentials)
        # silently invalidated the ad-hoc signature PyInstaller had already
        # applied - invisible here before that fix (and before this check
        # existed), since the app still launched fine unquarantined, ffmpeg
        # ran, and tests passed right up until a real user's downloaded
        # .dmg hit Gatekeeper's stricter quarantined check on Apple Silicon
        # and got "is damaged and can't be opened", with no override option
        # at all (worse than the expected, documented "unidentified
        # developer, right-click Open" prompt an intact-but-unnotarized
        # signature gets).
        run: codesign --verify --deep --strict --verbose=2 dist/Track-Tidy.app

      - name: Launch the app and verify it doesn't crash on startup
        # A local build's .app has no quarantine attribute (that's only
        # set on files that arrive via a browser/AirDrop/etc, not ones
        # compiled right here) - Gatekeeper's "unidentified developer"
        # block, a real concern for anyone who downloads the finished
        # .dmg, doesn't apply to this same-machine launch. Only checks
        # "does it start and stay up", not any actual feature.
        run: |
          "dist/Track-Tidy.app/Contents/MacOS/Track-Tidy" > launch.log 2>&1 &
          APP_PID=$!
          sleep 5
          if kill -0 $APP_PID 2>/dev/null; then
            echo "Still running after 5s (PID $APP_PID) - clean launch."
            screencapture -x launch_screenshot.png || echo "screencapture failed (no display attached to this runner?)"
            kill $APP_PID
          else
            echo "Exited within 5s on its own - crashed on startup. Log:"
            cat launch.log
            exit 1
          fi

      - name: Upload launch-check artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Track-Tidy-macOS-${{ matrix.arch }}-launch-check-v${{ github.run_number }}
          path: |
            launch.log
            launch_screenshot.png
          if-no-files-found: ignore

      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: Track-Tidy-macOS-${{ matrix.arch }}-v${{ github.run_number }}
          path: installer_output/*.dmg
          if-no-files-found: error

      - name: Attach .dmg + checksum to the GitHub Release
        # Only for a real release build (see the credentials step above) -
        # an ad-hoc smoke-test dispatch off a branch has no release to
        # attach to. GITHUB_TOKEN is the automatic per-run token GitHub
        # Actions provides, scoped to this repo - no extra secret needed.
        # Matches the Windows installer's own <name>.sha256 convention
        # (CLAUDE.md's ".sha256 checksum" note) so check_for_update's
        # verification works the same way on both platforms.
        #
        # build_mac.sh names the .dmg with an architecture suffix
        # (Track-Tidy-Setup-<version>-apple-silicon.dmg /
        # -intel.dmg, derived from uname -m) specifically so BOTH legs'
        # .dmg can be dispatched separately (`target` restricts each
        # dispatch to one arch) and uploaded to the SAME release without
        # colliding - check_for_update() matches the running
        # architecture's own suffix when picking which one to offer.
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd installer_output
          for dmg in *.dmg; do
            shasum -a 256 "$dmg" > "$dmg.sha256"
          done
          gh release upload "${{ github.ref_name }}" *.dmg *.dmg.sha256 --clobber --repo "${{ github.repository }}"
